<style>
/* Layout: пульт оператора — шапка с состоянием цеха, слева разделы, справа рабочая область.
   Ночная теплица: тёмно-хвойный фон, свет ламп — тёплый жёлтый, вода затопления — голубая, крафт — главное действие.
   Тема одна, тёмная, намеренно: пульт открыт часами и ночью, как приложения управления гроу-светом.
   Шрифты: Oswald — заголовки как на ленте логотипа, Golos Text — интерфейс, JetBrains Mono — показания и время. */
:root{
  --bg:#0B120F; --panel:#121C17; --panel-2:#18251F; --panel-3:#203028; --line:rgba(230,245,235,.075); --line-2:rgba(230,245,235,.14);
  --ink:#E7EEE8; --ink-2:#A4B4AA; --ink-3:#6C7E73;
  --kraft:#D3AE7A; --kraft-rgb:211,174,122; --on-kraft:#1B1308;
  --leaf:#7CC46B; --leaf-rgb:124,196,107; --lamp:#F3DC72; --lamp-rgb:243,220,114; --water:#5FB4DC; --water-rgb:95,180,220;
  --warn:#E5B04A; --bad:#EF6B5E; --bad-rgb:239,107,94;
  --f-d:'Oswald','Arial Narrow',Impact,sans-serif; --f-b:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif; --f-m:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-b);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(9,15,12,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top img{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff}
.brand b{font-family:var(--f-d);font-weight:500;font-size:16px;letter-spacing:.05em;text-transform:uppercase;display:block;line-height:1.15}
.brand small{color:var(--ink-3);font-size:12px}
.status{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.st{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--panel-2);color:var(--ink-2)}
.st b{font-family:var(--f-m);color:var(--ink);font-weight:600}
.led{width:7px;height:7px;border-radius:50%;background:var(--leaf);box-shadow:0 0 8px var(--leaf)}
.led.w{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.led.off{background:var(--ink-3);box-shadow:none}
.wrap{display:grid;grid-template-columns:226px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:12px 10px 64px;display:flex;flex-direction:column;gap:2px;position:sticky;top:59px;height:calc(100vh - 59px);overflow-y:auto}
.side .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:12px 10px 4px}
.side button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink-2);font-weight:600}
.side button:hover{background:var(--panel)}
.side button[aria-current="page"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--kraft)}
.side .cnt{margin-left:auto;font-size:11px;font-weight:800;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--kraft);color:var(--on-kraft)}
.side .cnt.r{background:var(--bad);color:#fff}
main{padding:20px max(16px,env(safe-area-inset-right,0px)) 60px 24px;min-width:0}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px))}.side .grp{display:none}.side button{white-space:nowrap}main{padding-left:max(16px,env(safe-area-inset-left,0px))}}

.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hd h1{font-family:var(--f-d);font-weight:500;font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.hd p{color:var(--ink-2);margin-top:4px;max-width:75ch}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.sb{justify-content:space-between}
.wr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mute{color:var(--ink-2)}.dim{color:var(--ink-3)}.small{font-size:12.5px}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.kpi{display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi .v{font-family:var(--f-m);font-size:26px;font-weight:600;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--ink-2);font-weight:400}
.kpi .s{font-size:12px;color:var(--ink-2)}
.kpi svg.sp{width:100%;height:34px;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(var(--leaf-rgb),.13);color:var(--leaf);white-space:nowrap}
.tag.w{background:rgba(229,176,74,.14);color:var(--warn)}
.tag.r{background:rgba(var(--bad-rgb),.14);color:var(--bad)}
.tag.b{background:rgba(var(--water-rgb),.14);color:var(--water)}
.tag.k{background:rgba(var(--kraft-rgb),.16);color:var(--kraft)}
.tag.n{background:var(--panel-3);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;background:var(--panel-3);border:1px solid var(--line-2);font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:rgba(var(--kraft-rgb),.6)}
.btn.p{background:var(--kraft);color:var(--on-kraft);border-color:var(--kraft)}
.btn.s{height:30px;padding:0 10px;font-size:12px;border-radius:9px}
.btn.d{color:var(--bad)}
.in,select.in{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;font-size:13px;min-width:0;width:100%}
.in.t{font-family:var(--f-m);width:86px;text-align:center}
.in.t[type=time]{width:120px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;color:var(--ink-2);font-weight:600}
.sw{position:relative;width:40px;height:22px;flex:none;border-radius:99px;background:var(--panel-3);border:1px solid var(--line-2);transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink-2);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:rgba(var(--leaf-rgb),.35);border-color:var(--leaf)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--leaf)}
input[type=range]{width:100%;accent-color:var(--kraft)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:800;border-bottom:0;border-top:1px solid var(--line-2)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--kraft);color:var(--on-kraft);font-weight:700;padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .3s}
@keyframes up{from{transform:translateY(16px);opacity:.3}}
@keyframes rise{from{transform:translateY(8px);opacity:.01}}
.enter>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(n+4){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* стеллажи */
.racks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.racks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rack{background:var(--bg);border:1px solid var(--line-2);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px}
.rack .rh{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--kraft);padding:2px 4px 4px}
.dark{border:1px dashed var(--line-2);border-radius:9px;padding:5px 8px;font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between}
.tray{border-radius:9px;padding:6px 8px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;text-align:left;position:relative}
.tray::before{content:"";height:3px;border-radius:2px;background:var(--panel-3)}
.tray.lit::before{background:var(--lamp);box-shadow:0 2px 10px rgba(var(--lamp-rgb),.55)}
.tray.sel{border-color:var(--kraft);box-shadow:0 0 0 1px var(--kraft)}
.tray .r1{display:flex;justify-content:space-between;gap:6px;font-size:11.5px}
.tray .r1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .pg{height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden}
.tray .pg i{display:block;height:100%;background:var(--leaf)}
.tray.ready .pg i{background:var(--kraft)}
.tray.flood{box-shadow:inset 0 -6px 10px -4px rgba(var(--water-rgb),.8)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* расписание */
.tl{overflow-x:auto}
.tl svg{display:block;min-width:720px;width:100%}
.plans{display:flex;flex-direction:column;gap:6px}
.plans button{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left}
.plans button[aria-pressed="true"]{border-color:var(--kraft);box-shadow:inset 0 0 0 1px var(--kraft)}
.times{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipx{display:inline-flex;align-items:center;gap:4px;background:rgba(var(--water-rgb),.12);color:var(--water);border-radius:9px;padding:2px 4px 2px 8px;font-family:var(--f-m);font-size:12.5px}
.chipx button{width:20px;height:20px;border-radius:6px;color:var(--ink-2)}
.fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dev{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dev:last-child{border-bottom:0}
@media (max-width:760px){.dev{grid-template-columns:minmax(0,1fr) auto}.dev .hide-m{display:none}}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .c{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.bar{height:8px;border-radius:5px;background:var(--panel-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--leaf)}
.bar.k i{background:var(--kraft)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:12px}
.chk[aria-checked="true"]{background:var(--leaf);border-color:var(--leaf);color:#0B120F}
/* технокарты и задачи */
.sbar{position:relative;display:flex;gap:3px;height:12px;border-radius:6px}
.sbar button{border-radius:5px;min-width:6px;padding:0}
.sbar.big{height:auto}
.sbar.big button{min-height:56px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;color:#0B120F;overflow:hidden;min-width:48px}
.sbar.big button b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar.big button span{font-size:11.5px}
.sbar.big button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--cream,#E7EEE8)}
.sbar .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.tlist{display:flex;flex-direction:column}
.titem{display:grid;grid-template-columns:auto 46px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.titem:last-child{border-bottom:0}
.titem.done b{text-decoration:line-through;color:var(--ink-3)}
.tdot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-top:5px;flex:none}
.tdot.k-soak{background:var(--water)}.tdot.k-sow{background:var(--leaf)}.tdot.k-light{background:var(--lamp)}.tdot.k-water{background:var(--water)}.tdot.k-cut{background:var(--kraft)}.tdot.k-check{background:var(--ink-2)}
.tsrc{font-size:11px;font-weight:700;letter-spacing:.03em}
textarea.in{resize:vertical;line-height:1.45}
/* мобильный пульт */
.pcv{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start;max-width:980px}
@media (max-width:900px){.pcv{grid-template-columns:minmax(0,1fr)}.mphone{margin:0 auto}}
.pnotes{display:flex;flex-direction:column;gap:10px;position:sticky;top:80px}
.pnotes h2{font-family:var(--f-d);font-weight:500;font-size:26px;text-transform:uppercase;line-height:1.1}
.pnotes ul{margin:0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.mphone{width:380px;max-width:100%;height:780px;border:9px solid #1E2622;border-radius:48px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 90px rgba(0,0,0,.6)}
@media (max-width:480px){.mphone{border-width:5px;border-radius:30px;height:max(600px,calc(100dvh - 160px))}}
.mtop{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 8px;font-size:12.5px;background:var(--panel);border-bottom:1px solid var(--line)}
.mscr{flex:1;overflow-y:auto;scrollbar-width:none}
.mscr::-webkit-scrollbar{display:none}
.mpad{padding:12px;display:flex;flex-direction:column;gap:10px}
.mtabs{display:flex;gap:4px;padding:8px 8px 14px;background:var(--panel);border-top:1px solid var(--line)}
.mtabs button{flex:1;padding:9px 4px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--ink-3);display:flex;justify-content:center;gap:5px;align-items:center}
.mtabs button[aria-current="page"]{background:var(--panel-3);color:var(--ink)}
.mtabs i{font-style:normal;font-size:10.5px;background:var(--kraft);color:var(--on-kraft);border-radius:9px;padding:0 6px}
.mpush{background:var(--panel-2);border:1px solid var(--line-2);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.mtask{display:grid;grid-template-columns:28px minmax(0,1fr) 10px;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:14px}
.mtask .chk{width:26px;height:26px}
.mtask.done{opacity:.55}
.mtask.done b{text-decoration:line-through}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mcard.c{gap:2px}
.mcard.c b{font-size:24px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtrays{display:flex;flex-direction:column;gap:4px}
.mtray{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;font-size:12.5px;padding:6px 8px;border-radius:9px;background:var(--bg);box-shadow:inset 3px 0 0 var(--c)}
.mtray.ready{background:rgba(var(--kraft-rgb),.14)}
/* финансовый симулятор */
.sim{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.sim{grid-template-columns:minmax(0,1fr)}}
.sl{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.sl:last-child{border-bottom:0}
.sl label{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.sl label b{font-family:var(--f-m);color:var(--ink)}
.sl .d{font-size:11.5px;font-family:var(--f-m)}
.up{color:var(--leaf)}.dn{color:var(--bad)}
.wf{display:flex;flex-direction:column;gap:6px}
.wf .r{display:grid;grid-template-columns:150px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px}
.wf .r i{display:block;height:18px;border-radius:5px;transition:width .35s cubic-bezier(.2,.8,.2,1),margin .35s}
.wf .r b{text-align:right;font-family:var(--f-m)}
@media (max-width:600px){.wf .r{grid-template-columns:110px minmax(0,1fr) 84px}}
pre.json{background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:12px;font:12px/1.5 var(--f-m);color:var(--ink-2);max-height:260px;overflow:auto;margin:0;white-space:pre}

function dayKwh(){const pa=S.plans[S.zone.A],pb=S.plans[S.zone.B];const fl=p=>p.floods.length*p.floodMin/60*.07;return .512*photo(pa)+.512*photo(pb)+fl(pa)+fl(pb)+.9*8+.48*6+.07*24+.05*24+1.2}
function dayChart(hist,m){
  const W=720,H=200,L=34,R=34,T=12,B=26,pw=W-L-R,ph=H-T-B,p=S.plans[S.zone.B];
  const x=i=>L+i/(hist.length-1)*pw,yt=v=>T+ph-(v-14)/(28-14)*ph,yh=v=>T+ph-(v-30)/(90-30)*ph;
  let bands='';for(let i=0;i<hist.length-1;i++){const mm=m-1440+i*30;if(lightOnAt(p,((mm%1440)+1440)%1440))bands+=`<rect x="${x(i)}" y="${T}" width="${pw/(hist.length-1)+.5}" height="${ph}" fill="var(--lamp)" opacity=".07"/>`}
  const pt=hist.map((h,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${yt(h.t).toFixed(1)}`).join(' '),pr=hist.map((h,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${yh(h.rh).toFixed(1)}`).join(' ');
  let ax='';[16,20,24,28].forEach(v=>{ax+=`<line x1="${L}" x2="${W-R}" y1="${yt(v)}" y2="${yt(v)}" stroke="var(--line)"/><text x="${L-6}" y="${yt(v)+4}" fill="var(--ink-3)" font-size="10" text-anchor="end" font-family="JetBrains Mono">${v}°</text>`});
  [40,60,80].forEach(v=>{ax+=`<text x="${W-R+6}" y="${yh(v)+4}" fill="var(--ink-3)" font-size="10" font-family="JetBrains Mono">${v}%</text>`});
  for(let i=0;i<=8;i++){const ii=i*6;ax+=`<text x="${x(ii)}" y="${H-8}" fill="var(--ink-3)" font-size="10" text-anchor="middle" font-family="JetBrains Mono">${i===8?'сейчас':hm(m-1440+ii*30)}</text>`}
  const band=`<rect x="${L}" y="${yh(p.rhDay+p.hyst)}" width="${pw}" height="${yh(p.rhDay-p.hyst)-yh(p.rhDay+p.hyst)}" fill="var(--water)" opacity=".08"/>`;
  return`<div class="tl"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Температура и влажность за сутки">${bands}${band}${ax}<path d="${pr}" fill="none" stroke="var(--water)" stroke-width="2"/><path d="${pt}" fill="none" stroke="var(--kraft)" stroke-width="2"/><circle cx="${x(hist.length-1)}" cy="${yt(hist[hist.length-1].t)}" r="4" fill="var(--kraft)"/><circle cx="${x(hist.length-1)}" cy="${yh(hist[hist.length-1].rh)}" r="4" fill="var(--water)"/></svg></div>`;
}

const nextFlood=(p,m)=>{const ts=p.floods.map(tm).sort((a,b)=>a-b);const n=ts.find(x=>x>m);return hm(n??ts[0])+(n===undefined?' завтра':'')};

function timeline(m){
  const W=960,L=150,R=12,rows=[['Свет · зона А','A','light'],['Свет · зона Б','B','light'],['Насос · бак А','A','pump'],['Насос · бак Б','B','pump'],['Осушитель (прогноз)','B','dry']],rh=30,H=rows.length*rh+30,pw=W-L-R,X=mm=>L+mm/1440*pw;
  let g='';for(let h=0;h<=24;h+=3)g+=`<line x1="${X(h*60)}" x2="${X(h*60)}" y1="0" y2="${rows.length*rh}" stroke="var(--line)"/><text x="${X(h*60)}" y="${rows.length*rh+18}" fill="var(--ink-3)" font-size="11" text-anchor="middle" font-family="JetBrains Mono">${String(h).padStart(2,'0')}:00</text>`;
  rows.forEach(([name,z,kind],i)=>{const p=S.plans[S.zone[z]],y=i*rh+6,h=rh-12;g+=`<text x="0" y="${y+h/2+4}" fill="var(--ink-2)" font-size="12" font-family="Golos Text">${name}</text><rect x="${L}" y="${y}" width="${pw}" height="${h}" rx="5" fill="var(--bg)"/>`;
   if(kind==='light'){const a=tm(p.on)+(z==='B'?10:0),b=tm(p.off);const seg=(s,e)=>g+=`<rect x="${X(s)}" y="${y}" width="${X(e)-X(s)}" height="${h}" rx="5" fill="var(--lamp)" opacity=".85"/>`;if(a<b)seg(a,b);else{seg(a,1440);seg(0,b)}}
   if(kind==='pump')p.floods.forEach(f=>{const s=tm(f),skip=p.noFloodDark&&!lightOnAt(p,s);g+=`<rect x="${X(s)}" y="${y}" width="${Math.max(4,X(s+p.floodMin)-X(s))}" height="${h}" rx="3" fill="${skip?'var(--ink-3)':'var(--water)'}" ${skip?'opacity=".5"':''}/>`});
   if(kind==='dry'){for(let mm=0;mm<1440;mm+=20){const sv=sensorAt(mm),pl=S.plans[S.zone.B],lim=(lightOnAt(pl,mm)?pl.rhDay:pl.rhNight)+pl.hyst-2.5;if(sv.rh>lim)g+=`<rect x="${X(mm)}" y="${y}" width="${X(20)-X(0)+.5}" height="${h}" fill="var(--leaf)" opacity=".7"/>`}}
  });
  g+=`<line x1="${X(m)}" x2="${X(m)}" y1="0" y2="${rows.length*rh}" stroke="var(--kraft)" stroke-width="2"/><circle cx="${X(m)}" cy="3" r="4" fill="var(--kraft)"/>`;
  return`<div class="tl"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Суточное расписание устройств">${g}</svg></div>`;
}
function stateAt(m){const pa=S.plans[S.zone.A],pb=S.plans[S.zone.B],fl=p=>p.floods.some(f=>m>=tm(f)&&m<tm(f)+p.floodMin&&!(p.noFloodDark&&!lightOnAt(p,tm(f))));const s=sensorAt(m);
  return[[`Свет А`,lightOnAt(pa,m)],[`Свет Б`,lightOnAt(pb,(m-10+1440)%1440)],[`Насос А`,fl(pa)],[`Насос Б`,fl(pb)],[`Осушитель`,s.rh>(lightOnAt(pb,m)?pb.rhDay:pb.rhNight)+pb.hyst-2.5]].map(([n,on])=>`<span class="tag ${on?'':'n'}">${n}: ${on?'вкл':'выкл'}</span>`).join('')+`<span class="tag k mono">${s.t.toFixed(1)}° · ${Math.round(s.rh)}%</span>`}
function planJson(id){const p=S.plans[id];const z=Object.entries(S.zone).filter(([,v])=>v===id).map(([k])=>k);return JSON.stringify({plan:p.name,zones:z,light:{relay:z.map(k=>k==='A'?'4chr3.ch1':'4chr3.ch2'),on:p.on,off:p.off,stagger_min:10},flood:{relay:z.map(k=>k==='A'?'4chr3.ch3':'4chr3.ch4'),times:p.floods,duration_min:p.floodMin,inching_failsafe_min:p.failsafe,skip_when_dark:p.noFloodDark},climate:{sensor:'ths01',day:{t:p.tDay,rh:p.rhDay},night:{t:p.tNight,rh:p.rhNight},dehumidifier:{relay:'thr320d',on_above:p.rhDay+p.hyst,off_below:p.rhDay-p.hyst}}},null,2)}

     <span class="lbl">Стадии · нажмите, чтобы изменить</span>${stageBar(r,0,true)}

     ${s.kind==='finish'?'<div class="note">На этой стадии пульт ставит задачу «Без полива перед срезкой» и напоминает срезать в последний день.</div>':''}
    </div>

function recipeTimeline(r){
  const ev=[];let d=0;
  r.stages.forEach((s,i)=>{if(s.kind==='soak'){ev.push(['накануне',`Замочить ${fmt(r.seed*r.boxes*1.1)} г · ${s.dur} ч`,s.note,'soak']);return}
    const first=d+1;d+=s.dur;
    if(s.kind==='dark'&&first===1)ev.push(['день 1',`Посеять ${r.boxes} боксов, на тёмную полку`,s.note,'sow']);
    else if(first===1)ev.push(['день 1',`Посеять ${r.boxes} боксов, сразу под свет`,s.note,'sow']);
    else if((s.kind==='light')&&r.stages[i-1]&&r.stages[i-1].kind==='dark')ev.push([`день ${first}`,'Снять груз, переставить на ярус, включить светильники',s.note,'light']);
    else if(s.kind==='finish')ev.push([`день ${first}`,'Без полива перед срезкой',s.note,'water']);
    else if(s.note)ev.push([`день ${first}`,s.name,s.note,'check']);
  });
  ev.push([`день ${d}`,`Срезать: ${r.boxes} боксов в витрину +4 °C`,'Маркировка термоэтикеткой, запайка.','cut']);
  return`<div class="tlist">${ev.map(e=>`<div class="titem" style="grid-template-columns:86px 14px minmax(0,1fr)"><span class="mono dim small">${e[0]}</span><i class="tdot k-${e[3]}"></i><div><b>${e[1]}</b>${e[2]?`<div class="small dim">${e[2]}</div>`:''}</div></div>`).join('')}</div>`;
}

const TKIND={cut:['Срезка','var(--kraft)'],sow:['Посев','var(--leaf)'],light:['На свет','var(--lamp)'],water:['Полив','var(--water)'],soak:['Замачивание','var(--water)'],check:['Контроль','var(--ink-2)'],pack:['Заказы','var(--kraft)'],route:['Рейс','var(--bad)']};
const DAYN=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const dateOf=off=>{const d=new Date(2026,9,23);d.setDate(d.getDate()+off);return d};
function buildTasks(racks,off){
  const out=[],add=(id,time,title,detail,kind,src,act)=>out.push({id,time,title,detail,kind,src,act,done:!!S.done[id]&&racks===S.racks});
  const wd=dateOf(off).getDay();
  add('ph-am','08:00','Замер pH и EC в баках А и Б','Yieldizer Lite · pH 5,6–6,0, EC по стадиям технокарт. Внести в журнал.','check','ежедневно');
  racks.forEach((tiers,ri)=>tiers.forEach((t,ti)=>{
    const r=rec(t.crop);if(!r)return;const tot=r.dark+r.light,{s,first}=stageOf(r,t.day),key=ri+'-'+ti,where=`Стеллаж ${ri+1}, ярус ${ti+1}`;
    if(t.day>=tot){add('cut-'+key,'09:00',`Срезать: ${r.name}`,`${where} · ${r.boxes} боксов, маркировка и в витрину +4 °C`,'cut',`технокарта · ${s.name}`,'harvest:'+key);
      const soak=r.stages.find(x=>x.kind==='soak');if(soak)add('soak-'+key,soak.dur>=20?'09:30':'20:00',`Замочить ${fmt(r.seed*r.boxes*1.1)} г: ${r.name}`,`К пересеву: ${where.toLowerCase()} · ${soak.dur} ч. ${soak.note}`,'soak','технокарта · замачивание');}
    else if(t.day===1&&!t.sown){const st0=r.stages.find(x=>x.kind!=='soak');add('sow-'+key,'10:00',`Посеять: ${r.name}`,`${r.boxes} боксов, ${fmt(r.seed*r.boxes)} г семян. ${st0.kind==='dark'?'Накрыть грузом, на тёмную полку.':'Сразу под свет.'} ${st0.note}`,'sow',`технокарта · ${st0.name}`,'sow:'+key);}
    else if(s.kind==='light'&&!t.lamp&&first===t.day){add('light-'+key,'08:30',`На свет: ${r.name}`,`${where} · снять груз, включить выключатели светильников. ${s.note}`,'light',`стадия «${s.name}»`,'lamp:'+key);}
    else if(s.kind==='finish'&&first===t.day){add('dry-'+key,'12:00',`Без полива перед срезкой: ${r.name}`,`${where} · закрыть кран поддона до срезки. ${s.note}`,'water',`стадия «${s.name}»`);}
  }));
  const ord=S.orders.filter(o=>o.st<2);if(ord.length)add('pack','11:00',`Собрать заказы: ${ord.length}`,ord.map(o=>'№'+o.n+' '+o.who.split(' ·')[0]).join(', '),'pack','заказы из приложения');
  if(wd===5)add('route-nog','14:00','Рейс в Ноглики','Термобокс, 200 км. Магазины и кафе по списку маршрута.','route','график районов');
  if(wd===2)add('route-alex','17:00','Рейс в Александровск-Сахалинский','55 км, вечерний рейс под предзаказ магазинов.','route','график районов');
  add('mold','16:00','Осмотр тёмной полки','Плесень на агровате, запах, влажность. Если VPD ниже 0,6 — включить осушитель вручную.','check','ежедневно');
  add('ph-pm','18:00','Вечерний замер pH и EC','Поправить раствор, если pH ушёл выше 6,2.','check','ежедневно');
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function tomorrowRacks(){return S.racks.map(t=>t.map(x=>{const r=rec(x.crop),tot=r.dark+r.light;if(x.day>=tot)return{crop:x.crop,day:1,lamp:false,sown:false};if(x.day===1&&!x.sown)return{...x,day:2,sown:true};const nd=x.day+1,{s}=stageOf(r,nd);return{...x,day:nd,lamp:x.lamp||(s.kind!=='dark'&&false)}}))}
function vTasks(){
  const list=buildTasks(S.racks,S.demoDay),done=list.filter(t=>t.done).length,d=dateOf(S.demoDay);

   ${parts.map(([n,f])=>{const ts=list.filter(f);return ts.length?`<span class="lbl" style="margin-top:6px">${n}</span><div class="tlist">${ts.map(taskRow).join('')}</div>`:''}).join('')}</div>

    <div class="panel"><h3>На телефоне</h3><p class="small mute">Тот же список приходит утром в Telegram и открывается в мобильном пульте.</p><button class="btn s" data-sec="phone" style="align-self:flex-start">Показать экран телефона</button></div>
   </div></div>`;
}
function taskRow(t){return`<div class="titem ${t.done?'done':''}"><button class="chk" role="checkbox" aria-checked="${t.done}" data-task="${t.id}" aria-label="Выполнено: ${t.title}">${t.done?'✓':''}</button><span class="mono small dim">${t.time}</span><div style="min-width:0"><b>${t.title}</b><div class="small dim">${t.detail}</div><span class="tsrc" style="color:${TKIND[t.kind][1]}">${TKIND[t.kind][0]} · ${t.src}</span></div></div>`}
function doTask(id){
  const t=buildTasks(S.racks,S.demoDay).find(x=>x.id===id);if(!t)return;
  if(S.done[id]){delete S.done[id];return}
  S.done[id]=true;
  if(t.act){const[a,k]=t.act.split(':'),[ri,ti]=k.split('-').map(Number),tr=S.racks[ri][ti];
    if(a==='harvest'){const r=rec(tr.crop);S.fridge[tr.crop]=(S.fridge[tr.crop]||0)+r.boxes;S.racks[ri][ti]={crop:tr.crop,day:1,lamp:false,sown:false};toast(`${r.name}: +${r.boxes} боксов в витрину. Поддон ждёт посева`)}
    if(a==='sow'){tr.sown=true;toast('Посеяно — завтра день 2')}
    if(a==='lamp'){tr.lamp=true;toast('Светильники яруса включены')}}
}

/* ---- финансы ---- */
/* учёт по факту: продажи из приложения, отгрузки по договорам и журнал расходов собираются по дням,
   из дней — недели и месяцы. Дни после «сегодня» — прогноз. Демо: работа с 2 ноября 2026, сегодня — 17 декабря */
const D0=new Date(2026,10,2),TODAY=45;
const dOf=k=>{const d=new Date(D0);d.setDate(d.getDate()+k);return d};
const dfmt=(k,o)=>dOf(k).toLocaleDateString('ru-RU',o||{day:'numeric',month:'short'}).replace('.','');
const WDF=[.9,.95,1,1,1.25,1.3,.8];
const RET_P=196,SUB_P=160,COST=24000/990;
const MONTHS3=[{n:'Ноябрь',k0:0,k1:28,plan:76200,net:52652},{n:'Декабрь',k0:29,k1:59,plan:152400,net:113804},{n:'Январь',k0:60,k1:90,plan:152400,net:113804}];
const CONTRACTS0=[
 {name:'ТЦ «Столичный»',start:7,dow:0,packs:30,price:157,on:true},
 {name:'Магазин «Берёзка»',start:14,dow:2,packs:20,price:154,on:true},
 {name:'Кафе «Сахалин»',start:21,dow:4,packs:12,price:150,on:true},
];
const EXP0=[
 {k:0,cat:'Электричество и вода',sum:4600,note:'Ноябрь, по счётчику'},{k:0,cat:'Связь и банк',sum:500,note:'Интернет и обслуживание счёта'},
 {k:16,cat:'Расходники',sum:640,note:'Перекись, перчатки'},{k:29,cat:'Электричество и вода',sum:5200,note:'Декабрь, по счётчику'},
 {k:29,cat:'Связь и банк',sum:500,note:''},{k:33,cat:'Ремонт',sum:900,note:'Крыльчатка помпы'},
];
const EXPCATS=['Электричество и вода','Транспорт и бензин','Связь и банк','Расходники','Закупка семян и упаковки','Ремонт','Прочее'];
const subsAt=k=>[0,2,4,5,7,8,9][Math.min(6,Math.floor(Math.min(k,TODAY)/7))];
const retailFact=k=>{const base=k<14?4+k*.5:11+(k-14)*.15;return Math.round(base*WDF[k%7]*(1+.08*Math.sin(k*1.7)))};
const isoOf=k=>{const d=dOf(k);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const kOfIso=s=>{const[y,m,d]=s.split('-').map(Number);return Math.round((new Date(y,m-1,d)-D0)/864e5)};
/* прогноз розницы: средний темп последних 3 недель с поправкой на день недели и тренд к предыдущим 2 неделям */
let RF=null;
function retailFc(){if(RF)return RF;const unit=(a,b)=>{let s=0,w=0;for(let k=a;k<=b;k++){s+=retailFact(k);w+=WDF[k%7]}return s/w};const u=unit(TODAY-20,TODAY),u0=unit(TODAY-34,TODAY-21);const g=Math.max(-.01,Math.min(.01,Math.pow(u/u0,1/21)-1));RF={u,g};return RF}
function day(k){
  const fc=k>TODAY,f=retailFc(),rN=fc?f.u*WDF[k%7]*Math.pow(1+f.g,k-TODAY):retailFact(k),sN=k%7===4?subsAt(k)*4:0;
  let bN=0,b=0;const lines=[];(S.contracts||[]).forEach(c=>{if(c.on&&k>=c.start&&k%7===c.dow){bN+=c.packs;b+=c.packs*c.price;lines.push([c.name,c.packs,c.packs*c.price])}});
  const r=rN*RET_P,s=sN*SUB_P,cost=(rN+sN+bN)*COST;
  const ex={};const addE=(cat,v)=>ex[cat]=(ex[cat]||0)+v;
  if(k%7===0)addE('Транспорт и бензин',750);
  (S.expenses||[]).forEach(e=>{if(e.k===k)addE(e.cat,e.sum)});
  if(fc&&[60].includes(k)){addE('Электричество и вода',5200);addE('Связь и банк',500)}
  const fixed=Object.values(ex).reduce((a,v)=>a+v,0),tax=(r+s)*.04+b*.06;
  return{k,fc,rN,sN,bN,r,s,b,rev:r+s+b,cost,fixed,ex,tax,net:r+s+b-cost-fixed-tax,lines};
}
function agg(k0,k1){

function weeksChart(P){

  const ws=Array.from({length:N},(_,w)=>({w,a:agg(w*7,w*7+6),p:planOf(w*7,w*7+6)}));

  for(let v=0;v<=mx;v+=10000)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" fill="var(--ink-3)" font-size="10" text-anchor="end" font-family="JetBrains Mono">${v/1000}к</text>`;
  let pl='';ws.forEach(({w,a,p})=>{const x=L+w*bw+bw*.16,bwid=bw*.68;let acc=0;
    const seg=(v,col,fc)=>{if(v<=0)return;const h=v/mx*ph;g+=`<rect x="${x}" y="${y(acc+v)}" width="${bwid}" height="${h}" fill="${col}" ${fc?'opacity=".55"':''}/>`+(fc?`<rect x="${x}" y="${y(acc+v)}" width="${bwid}" height="${h}" fill="url(#hatch)"/>`:'');acc+=v};
    seg(a.fa.r,'var(--leaf)');seg(a.fa.s,'var(--water)');seg(a.fa.b,'var(--kraft)');seg(a.fo.r,'var(--leaf)',1);seg(a.fo.s,'var(--water)',1);seg(a.fo.b,'var(--kraft)',1);
    const sel=P.kind==='week'?P.w===w:(w*7+6>=P.k0&&w*7<=P.k1);
    if(sel)g+=`<rect x="${x-3}" y="${T}" width="${bwid+6}" height="${ph}" fill="none" stroke="var(--kraft)" stroke-width="1.5" rx="4"/>`;
    g+=`<text x="${x+bwid/2}" y="${H-12}" fill="${sel?'var(--ink)':'var(--ink-3)'}" font-size="10" text-anchor="middle" font-family="JetBrains Mono">${dfmt(w*7,{day:'numeric',month:'numeric'})}</text><rect x="${x}" y="${T}" width="${bwid}" height="${ph}" fill="transparent" data-week="${w}" style="cursor:pointer"><title>Неделя ${w+1}: ${fmt(a.fa.rev+a.fo.rev)} ₽${a.fo.rev?' (с прогнозом)':''}</title></rect>`;

  return`<div class="tl"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Выручка по неделям: факт и прогноз">${g}</svg></div><span class="small dim">Нажмите на неделю, чтобы открыть её.</span>`;
}

   <span class="small dim">Закрыто периодов: ${CW} недель · ноябрь.</span></div>`;
}


/* ====== отрисовка и события ====== */
const VIEWS={tasks:vTasks,phone:vPhone,over:vOver,racks:vRacks,sched:vSched,recipes:vRecipes,devices:vDevices,rules:vRules,orders:vOrders,clients:vClients,catalog:vCatalog,sow:vSow,finance:vFinance};
function render(keep){const y=window.scrollY;renderSide();renderStatus();$('#main').innerHTML=(VIEWS[S.sec]||vOver)();if(keep)window.scrollTo(0,y);else window.scrollTo(0,0);save()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset;
  if(a.sec){S.sec=a.sec;render();return}
  if(a.tray){S.sel=a.tray.split(':').map(Number);render(true);return}
  if(a.plan){S.editPlan=a.plan;render(true);return}
  if(a.rmflood!==undefined){S.plans[S.editPlan].floods.splice(+a.rmflood,1);render(true);return}
  if(a.dev!==undefined){const d=S.devices[+a.dev];d.on=!d.on;d.mode='manual';render(true);toast(`${d.what.split(' (')[0]}: ${d.on?'включено':'выключено'} вручную`);return}
  if(a.gw){S.gw.type=a.gw;render(true);return}
  if(a.rule!==undefined){S.rules[+a.rule].on=!S.rules[+a.rule].on;render(true);return}
  if(a.adv){const o=S.orders.find(x=>x.n==a.adv);o.st=Math.min(4,o.st+1);render(true);toast(`Заказ №${o.n}: «${ST[o.st]}» — покупатель получит уведомление`);return}
  if(a.approve!==undefined){const c=S.clients[+a.approve];c.state='ok';render(true);toast(`${c.name}: опт одобрен — клиенту ушло сообщение, оптовая витрина открыта на его Telegram ID`);return}
  if(a.reject!==undefined){const c=S.clients[+a.reject];c.state='no';c.reason=$('#rsn-'+a.reject)?.value||'ИНН не совпадает с названием торговой точки';render(true);toast(`${c.name}: заявка отклонена, клиент увидит причину`);return}
  if(a.revoke!==undefined){const c=S.clients[+a.revoke];c.state='new';render(true);toast(`${c.name}: доступ закрыт, заявка снова на проверке`);return}
  if(a.accper){S.acc.per=a.accper;S.acc.off=0;render(true);return}
  if(a.accoff!==undefined){const lim=S.acc.per==='week'?[-CW,4]:[-1,1];S.acc.off=+a.accoff===0?0:Math.max(lim[0],Math.min(lim[1],S.acc.off+ +a.accoff));render(true);return}
  if(a.ctron!==undefined){const c=S.contracts[+a.ctron];c.on=!c.on;render(true);toast(`${c.name}: договор ${c.on?'действует':'на паузе'}`);return}
  if(a.expdel!==undefined){S.expenses.splice(+a.expdel,1);render(true);return}
  if(a.act==='expadd'){const k=$('#exd').value?kOfIso($('#exd').value):NaN,sum=+$('#exs').value;if(!(k>=0)||!(sum>0)){toast('Укажите дату не раньше 2 ноября и сумму больше нуля');return}S.expenses.push({k,cat:$('#exc').value,sum,note:$('#exn').value.trim()});render(true);toast(`Расход ${fmt(sum)} ₽ записан${k>TODAY?' — дата в будущем, попадёт в прогноз':''}`);return}
  if(a.act==='ctradd'){const n=$('#ctrnew').value;S.contracts.push({name:n,start:TODAY+1,dow:(TODAY+1)%7,packs:20,price:155,on:true});render(true);toast(`${n}: договор заключён, первая отгрузка ${dfmt(TODAY+1,{weekday:'long'})}`);return}
  if(a.act==='acctg'){S.acc.tg=!S.acc.tg;render(true);return}
  if(a.recipe){S.selRecipe=a.recipe;S.selStage=0;render(true);return}
  if(a.stage!==undefined){S.selStage=+a.stage;render(true);return}
  if(a.task){doTask(a.task);render(true);if(S.sec==='phone'){const ms=$('#mscr');ms&&(ms.scrollTop=ms._y||0)}return}
  if(a.ptab){S.ptab=a.ptab;render(true);return}
  if(a.ovr){const k=a.ovr.slice(1),p=S.plans[S.zone[k]],cur=S.ovr[a.ovr]?S.ovr[a.ovr].v:lightOnAt(p,nowMin());S.ovr[a.ovr]={v:!cur,until:hm(nowMin()+120)};render(true);toast(`Свет зоны ${k==='A'?'А':'Б'} ${!cur?'включён':'выключен'} вручную на 2 часа`);return}
  if(a.ovrreset){delete S.ovr[a.ovrreset];render(true);return}
  if(a.floodnow){const p=S.plans[S.zone[a.floodnow]];toast(`Насос зоны ${a.floodnow==='A'?'А':'Б'}: затопление ${p.floodMin} мин, аварийное отключение через ${p.failsafe} мин`);return}
  const cr=S.recipes.find(x=>x.id===S.selRecipe);
  const [r,t]=S.sel;
  switch(a.act){
   case'lamp':S.racks[r][t].lamp=!S.racks[r][t].lamp;render(true);break;
   case'harvest':{const tr=S.racks[r][t],rc=rec(tr.crop);S.fridge[tr.crop]=(S.fridge[tr.crop]||0)+rc.boxes;tr.day=1;tr.lamp=false;render(true);toast(`${rc.name}: +${rc.boxes} боксов в витрину, поддон на пересев`);break}
   case'resow':S.racks[r][t].day=1;S.racks[r][t].lamp=false;render(true);toast('Поддон пересеян — день 1, переносите на тёмную полку');break;
   case'now':S.scrub=null;render(true);break;
   case'addflood':{const v=$('#newflood').value;const p=S.plans[S.editPlan];if(v&&!p.floods.includes(v)){p.floods.push(v);p.floods.sort()}render(true);break}
   case'nfd':S.plans[S.editPlan].noFloodDark=!S.plans[S.editPlan].noFloodDark;render(true);break;
   case'saveplan':S.plans[S.editPlan].name=$('#pname').value||S.plans[S.editPlan].name;render(true);toast('План сохранён'+(Object.values(S.zone).includes(S.editPlan)?' и применён к зоне':''));break;
   case'dupplan':{const id='p'+Date.now().toString(36);S.plans[id]=Object.assign(JSON.parse(JSON.stringify(S.plans[S.editPlan])),{name:S.plans[S.editPlan].name+' (копия)'});S.editPlan=id;render(true);break}
   case'json':S.json=!S.json;render(true);break;
   case'copyjson':{const txt=planJson(S.editPlan);try{navigator.clipboard.writeText(txt).then(()=>toast('Скопировано'),()=>toast('Выделите текст и скопируйте вручную'))}catch(err){toast('Выделите текст и скопируйте вручную')}break}
   case'gwtest':toast('Нет ответа: прототип не подключён к реле. Адрес и способ сохранены.');break;
   case'addrule':S.rules.push({id:Date.now(),on:true,if:'Влажность',op:'>',val:65,then:'Тревога в Telegram',arg:'',why:'Новое правило'});render(true);break;
   case'addrecipe':{const id='c'+Date.now().toString(36);S.recipes.push(syncR({id,name:'Новая культура',type:'micro',seed:10,boxes:16,stages:[st_('dark','Посев и прижим',3,'spray',2,'—',''),st_('light','Рост',6,'flood',2,'0,8–1,0',''),st_('finish','Финиш',1,'none',0,'—','')]}));S.selRecipe=id;S.selStage=0;render(true);break}
   case'stup':case'stdown':{const i=S.selStage,j=a.act==='stup'?i-1:i+1;if(j<0||j>=cr.stages.length)break;[cr.stages[i],cr.stages[j]]=[cr.stages[j],cr.stages[i]];S.selStage=j;syncR(cr);render(true);break}
   case'stadd':cr.stages.splice(S.selStage+1,0,st_('light','Новая стадия',2,'flood',2,'0,8','') );S.selStage++;syncR(cr);render(true);break;
   case'stdel':if(cr.stages.length>1){cr.stages.splice(S.selStage,1);S.selStage=Math.max(0,S.selStage-1);syncR(cr);render(true)}break;
   case'nextday':S.racks.forEach(tiers=>tiers.forEach(x=>{const rr=rec(x.crop),tot=rr.dark+rr.light;if(x.day===1&&!x.sown)return;if(x.day<tot)x.day++}));S.done={};S.demoDay++;render(true);toast('Наступил '+DAYN[dateOf(S.demoDay).getDay()]+': поддоны выросли на день');break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target,d=el.dataset;
  if(el.id==='scrub'){S.scrub=+el.value;const svg=document.querySelector('.tl');svg.outerHTML=timeline(S.scrub);el.nextElementSibling.textContent=hm(S.scrub);el.closest('.panel').querySelector('.row.wr').innerHTML=stateAt(S.scrub);return}
  if(el.id==='tday'){S.racks[S.sel[0]][S.sel[1]].day=+el.value;render(true);return}
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(d.zone){S.zone[d.zone]=el.value;render(true);toast(`Зона ${d.zone==='A'?'А':'Б'}: план «${S.plans[el.value].name}»`);return}
  if(d.pf){const p=S.plans[S.editPlan];p[d.pf]=el.type==='number'?+el.value:el.value;render(true);return}
  if(d.rf){const r=S.recipes.find(x=>x.id===S.selRecipe);r[d.rf]=d.rf==='type'?el.value:+el.value;render(true);return}
  if(d.sf){const r=S.recipes.find(x=>x.id===S.selRecipe),s=r.stages[S.selStage];s[d.sf]=['dur','times'].includes(d.sf)?Math.max(d.sf==='dur'?1:0,+el.value||0):el.value;if(d.sf==='water'&&el.value==='none')s.times=0;syncR(r);render(true);return}
  if(el.id==='rname'){S.recipes.find(x=>x.id===S.selRecipe).name=el.value||'Без названия';render(true);return}
  if(d.ctr){const[i,f]=d.ctr.split(':');S.contracts[+i][f]=Math.max(1,+el.value||1);render(true);return}
  if(el.id==='accclose'){S.acc.close=el.value;render(true);return}
  if(d.rv!==undefined){S.rules[+d.rv].val=+el.value;save();return}
  if(d.dmode!==undefined){S.devices[+d.dmode].mode=el.value;render(true);return}
  if(el.id==='tcrop'){const t=S.racks[S.sel[0]][S.sel[1]];t.crop=el.value;t.day=1;render(true);return}
  if(el.id==='ccrop'){S.calc.crop=el.value;render(true);return}
  if(el.id==='cbox'){S.calc.boxes=Math.max(1,+el.value||1);render(true);return}
  if(el.id==='tariff'){S.tariff=+el.value||0;render(true);return}
  if(el.id==='gwurl'){S.gw.url=el.value;save();return}
});
document.addEventListener('click',e=>{const r=e.target.closest('rect[data-week]');if(r){S.acc.per='week';S.acc.off=+r.dataset.week-CW;render(true)}});
setInterval(renderStatus,30000);
render();
</script>
